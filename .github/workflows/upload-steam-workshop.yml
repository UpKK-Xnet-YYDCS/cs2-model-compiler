name: Upload to Steam Workshop

on:
  workflow_dispatch:
    inputs:
      steam_user:
        description: "Steam username (leave empty for anonymous)"
        required: false
        default: "anonymous"
      steam_password:
        description: "Steam password (use with care, prefer cached login)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and run Steam Workshop upload
        run: |
          # Add uv to PATH
          $uvPath = "C:\WINDOWS\ServiceProfiles\NetworkService\.local\bin"
          $env:Path = "$uvPath;$env:Path"

          # Verify uv
          uv --version

          # Install dependencies
          Set-Location F:\CS2-ModelBuilder
          if (Test-Path "requirements.txt") {
            uv pip install -r requirements.txt
          }

          # Run Steam Workshop upload script
          $steamUser = "${{ github.event.inputs.steam_user }}"
          $steamPassword = "${{ github.event.inputs.steam_password }}"

          if ($steamPassword) {
            uv run upload_steam_workshop.py --steam-user "$steamUser" --steam-password "$steamPassword"
          } else {
            uv run upload_steam_workshop.py --steam-user "$steamUser"
          }
        shell: powershell
