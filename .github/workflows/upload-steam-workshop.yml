name: Upload to Steam Workshop

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and run Steam Workshop upload
        run: |
          # Add uv to PATH
          $uvPath = "C:\WINDOWS\ServiceProfiles\NetworkService\.local\bin"
          $env:Path = "$uvPath;$env:Path"

          # Verify uv
          uv --version

          # Install dependencies
          Set-Location F:\CS2-ModelBuilder
          if (Test-Path "requirements.txt") {
            uv pip install -r requirements.txt
          }

          # Run Steam Workshop upload script (uses local steam_config.txt)
          uv run upload_steam_workshop.py
        shell: powershell
