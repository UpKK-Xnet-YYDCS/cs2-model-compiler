name: Compile Models

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and run all tasks
        run: |
          # Add uv to PATH permanently for this job
          $uvPath = "C:\WINDOWS\ServiceProfiles\NetworkService\.local\bin"
          $env:Path = "$uvPath;$env:Path"

          # Verify uv
          uv --version

          # Check/Install Python
          try {
            $pythonCheck = uv run python --version 2>$null
            Write-Output "Python available: $pythonCheck"
          } catch {
            Write-Output "Installing Python..."
            uv python install
          }

          # Install dependencies
          Set-Location F:\CS2-ModelBuilder
          if (Test-Path "requirements.txt") {
            uv pip install -r requirements.txt
          } else {
            Write-Output "No requirements.txt found, skipping"
          }

          # Run compile script
          uv run python compile_models.py
        shell: powershell

      - name: Install dependencies
        working-directory: F:\CS2-ModelBuilder
        run: uv pip install -r requirements.txt
        shell: powershell

      - name: Run compile_models.py
        working-directory: F:\CS2-ModelBuilder
        run: uv run python compile_models.py
        shell: powershell

      - name: Copy BuildStats.md to repository
        run: Copy-Item "F:\CS2-ModelBuilder\compiled\BuildStats.md" -Destination "BuildStats.md" -Force
        shell: powershell

      - name: Commit and push BuildStats.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update BuildStats.md from latest compilation"
          file_pattern: "BuildStats.md"

      - name: Upload BuildStats.md as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-stats
          path: F:\CS2-ModelBuilder\compiled\BuildStats.md
          if-no-files-found: warn

      - name: Upload compiled models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-models
          path: F:\CS2-ModelBuilder\compiled
          if-no-files-found: warn
