name: Compile Models

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        working-directory: F:\CS2-ModelBuilder
        run: uv pip install -r requirements.txt

      - name: Run compile_models.py
        working-directory: F:\CS2-ModelBuilder
        run: uv run python compile_models.py
