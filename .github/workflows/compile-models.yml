name: Compile Models

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python and uv (skip if exists)
        run: |
          # Add common uv install paths to PATH
          $uvPaths = @(
            "C:\WINDOWS\ServiceProfiles\NetworkService\.local\bin",
            "$env:USERPROFILE\.local\bin",
            "$env:LOCALAPPDATA\Programs\uv",
            "C:\Users\e54385991\.local\bin"
          )

          foreach ($path in $uvPaths) {
            if (Test-Path "$path\uv.exe") {
              $env:Path = "$path;$env:Path"
              Write-Output "Found uv at: $path"
              break
            }
          }

          # Check if uv exists
          try {
            $uvVersion = uv --version 2>$null
            Write-Output "uv already installed: $uvVersion"
          } catch {
            Write-Output "Installing uv..."
            Invoke-RestMethod https://astral.sh/uv/install.ps1 | Invoke-Expression
            # Add to PATH for current session
            $env:Path = "C:\WINDOWS\ServiceProfiles\NetworkService\.local\bin;$env:Path"
          }

          # Verify uv is working
          uv --version

          # Check if Python installed
          $pythonVersion = uv python list --installed 2>$null | Select-String "cpython" | Select-Object -First 1
          if ($pythonVersion) {
            Write-Output "Python already installed: $pythonVersion"
          } else {
            Write-Output "Installing Python..."
            uv python install
          }
        shell: powershell

      - name: Install dependencies
        working-directory: F:\CS2-ModelBuilder
        run: uv pip install -r requirements.txt
        shell: powershell

      - name: Run compile_models.py
        working-directory: F:\CS2-ModelBuilder
        run: uv run python compile_models.py
        shell: powershell

      - name: Copy BuildStats.md to repository
        run: Copy-Item "F:\CS2-ModelBuilder\compiled\BuildStats.md" -Destination "BuildStats.md" -Force
        shell: powershell

      - name: Commit and push BuildStats.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update BuildStats.md from latest compilation"
          file_pattern: "BuildStats.md"

      - name: Upload BuildStats.md as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-stats
          path: F:\CS2-ModelBuilder\compiled\BuildStats.md
          if-no-files-found: warn

      - name: Upload compiled models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-models
          path: F:\CS2-ModelBuilder\compiled
          if-no-files-found: warn
