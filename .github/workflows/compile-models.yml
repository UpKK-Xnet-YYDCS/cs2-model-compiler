name: Compile Models

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        working-directory: F:\CS2-ModelBuilder
        run: uv pip install -r requirements.txt

      - name: Run compile_models.py
        working-directory: F:\CS2-ModelBuilder
        run: uv run python compile_models.py

      - name: Upload BuildStats.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-stats
          path: F:\CS2-ModelBuilder\compiled\BuildStats.md
          if-no-files-found: warn

      - name: Upload compiled models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-models
          path: F:\CS2-ModelBuilder\compiled
          if-no-files-found: warn
