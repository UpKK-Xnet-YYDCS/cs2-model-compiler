name: Compile Models

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and run all tasks
        run: |
          # Add uv to PATH permanently for this job
          $uvPath = "C:\WINDOWS\ServiceProfiles\NetworkService\.local\bin"
          $env:Path = "$uvPath;$env:Path"

          # Verify uv
          uv --version

          # Check/Install Python
          try {
            $pythonCheck = uv run python --version 2>$null
            Write-Output "Python available: $pythonCheck"
          } catch {
            Write-Output "Installing Python..."
            uv python install
          }

          # Install dependencies
          Set-Location F:\CS2-ModelBuilder
          uv pip install -r requirements.txt

          # Run compile script
          uv run python compile_models.py --source-dir "F:\CS2-ModelBuilder"

          # Copy BuildStats.md to repository root
          Copy-Item "F:\CS2-ModelBuilder\compiled\BuildStats.md" -Destination "$env:GITHUB_WORKSPACE\BuildStats.md" -Force
        shell: powershell

      - name: Commit and push BuildStats.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BuildStats.md
          $diff = git diff --staged --quiet 2>&1
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update BuildStats.md from latest compilation"
            git push
          } else {
            Write-Output "No changes to commit"
          }
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
